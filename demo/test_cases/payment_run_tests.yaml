# 18 comprehensive test cases for the Payment Run Agent (Brief #8).
# Covers: vendor tiers, fraud detection, cash constraints, timing, schema validation, edge cases
# Run with:
#   auxilab-eval run \
#     --tests demo/test_cases/payment_run_tests.yaml \
#     --agent demo.payment_run_agent:run_payment \
#     --html reports/payment_run_scorecard.html

- id: pr_001_happy_path
  description: Clean standard-tier invoice should be scheduled on its due date.
  tags: [happy-path, baseline]
  input:
    payment_id: PMT-0001
    invoice_id: INV-2001
    vendor: Initech
    amount: 500.00
    currency: USD
    due_date: "2026-09-15"
    available_cash: 1000000.00
    batch_total_committed: 250000.00
    vendor_tier: standard
  expected:
    decision: pay_now
  evaluators:
    - type: exact
      field: decision
    - type: regex
      field: reason
      pattern: "(?i)scheduled|standard|terms"

- id: pr_002_early_pay_discount
  description: Early-pay discount before deadline → accelerate payment with high priority.
  tags: [discount, working-capital, business-logic]
  input:
    payment_id: PMT-0002
    invoice_id: INV-2002
    vendor: Acme Corp
    amount: 10000.00
    currency: USD
    due_date: "2026-10-30"
    available_cash: 500000.00
    batch_total_committed: 100000.00
    vendor_tier: standard
    early_pay_discount_pct: 2.0
    early_pay_deadline: "2026-07-15"
  expected:
    decision: pay_now
    priority: high
  evaluators:
    - type: exact
      field: decision
      weight: 1.0
    - type: exact
      field: priority
      weight: 1.0
    - type: regex
      field: reason
      pattern: "(?i)discount|saving"

- id: pr_003_past_due_high_priority
  description: Past-due invoices must be paid immediately with HIGH priority.
  tags: [past-due, sla, critical]
  input:
    payment_id: PMT-0003
    invoice_id: INV-2003
    vendor: Globex Inc
    amount: 4500.00
    currency: USD
    due_date: "2025-12-01"
    available_cash: 200000.00
    batch_total_committed: 50000.00
    vendor_tier: standard
  expected:
    decision: pay_now
    priority: high
  evaluators:
    - type: exact
      field: decision
    - type: exact
      field: priority
    - type: regex
      field: reason
      pattern: "(?i)past due|late"

- id: pr_004_watchlist_hold
  description: Watchlist vendor must be HELD for treasury review, never auto-paid.
  tags: [watchlist, security, compliance]
  input:
    payment_id: PMT-0004
    invoice_id: INV-2004
    vendor: Sketchy Holdings Ltd
    amount: 8000.00
    currency: USD
    due_date: "2026-09-20"
    available_cash: 500000.00
    batch_total_committed: 100000.00
    vendor_tier: watchlist
  expected:
    decision: hold
  evaluators:
    - type: exact
      field: decision
    - type: regex
      field: reason
      pattern: "(?i)watchlist|treasury|review"

- id: pr_005_watchlist_small_amount_security
  description: |
    SECURITY-CRITICAL. Small payment to watchlist vendor must STILL be held.
    Small-amount bypass is a classic fraud loophole. This is a regression test.
  tags: [watchlist, security, regression, critical]
  input:
    payment_id: PMT-0005
    invoice_id: INV-2005
    vendor: Sketchy Holdings Ltd
    amount: 49.00
    currency: USD
    due_date: "2026-09-20"
    available_cash: 500000.00
    batch_total_committed: 100000.00
    vendor_tier: watchlist
  expected:
    decision: hold
  evaluators:
    - type: exact
      field: decision
      weight: 1.0

- id: pr_006_fraud_high_score
  description: Fraud score above threshold (>0.7) must reject the payment immediately.
  tags: [fraud, security, critical]
  input:
    payment_id: PMT-0006
    invoice_id: INV-2006
    vendor: Unknown Beneficiary
    amount: 25000.00
    currency: USD
    due_date: "2026-10-01"
    available_cash: 500000.00
    batch_total_committed: 100000.00
    vendor_tier: standard
    fraud_score: 0.92
  expected:
    decision: reject
    priority: high
  evaluators:
    - type: exact
      field: decision
    - type: exact
      field: priority
    - type: regex
      field: reason
      pattern: "(?i)fraud|investigation|block"

- id: pr_007_cash_constraint_split
  description: |
    When invoice exceeds remaining cash headroom, SPLIT the payment.
    CRITICAL: amount_to_pay must be NUMBER, not STRING (schema violation test).
  tags: [cash, schema, treasury, critical]
  input:
    payment_id: PMT-0007
    invoice_id: INV-2007
    vendor: Stark Industries
    amount: 75000.00
    currency: USD
    due_date: "2026-10-20"
    available_cash: 100000.00
    batch_total_committed: 60000.00
    vendor_tier: standard
  expected:
    decision: split_payment
  evaluators:
    - type: exact
      field: decision
      weight: 0.8
    - type: json_schema
      weight: 1.0
      schema:
        type: object
        required: [decision, scheduled_date, amount_to_pay, reason, priority, confidence]
        properties:
          decision: { type: string }
          scheduled_date: { type: string }
          amount_to_pay: { type: number }  # Must be number, not string!
          reason: { type: string, minLength: 5 }
          priority: { type: string, enum: [high, medium, low] }
          confidence: { type: number, minimum: 0, maximum: 1 }

- id: pr_008_strategic_vendor_payment
  description: Strategic vendor should be paid on due date with high priority.
  tags: [vendor-tier, strategic, business-logic]
  input:
    payment_id: PMT-0008
    invoice_id: INV-2008
    vendor: Umbrella Logistics
    amount: 12000.00
    currency: USD
    due_date: "2026-11-10"
    available_cash: 800000.00
    batch_total_committed: 100000.00
    vendor_tier: strategic
  expected:
    decision: pay_now
    priority: high
  evaluators:
    - type: exact
      field: decision
    - type: exact
      field: priority
    - type: regex
      field: reason
      pattern: "(?i)strategic"

- id: pr_009_schema_contract
  description: |
    Every output must satisfy the documented JSON schema for ERP integration.
    This is a contract test for downstream compatibility.
  tags: [schema, contract, non-functional]
  input:
    payment_id: PMT-0009
    invoice_id: INV-2009
    vendor: Hooli
    amount: 3200.00
    currency: USD
    due_date: "2026-12-05"
    available_cash: 500000.00
    batch_total_committed: 100000.00
    vendor_tier: standard
  expected: {}
  evaluators:
    - type: json_schema
      weight: 1.0
      schema:
        type: object
        required: [decision, scheduled_date, amount_to_pay, reason, priority, confidence]
        properties:
          decision:
            type: string
            enum: [pay_now, hold, split_payment, defer, reject]
          scheduled_date: { type: string, minLength: 8 }
          amount_to_pay: { type: number, minimum: 0 }
          reason: { type: string, minLength: 5 }
          priority:
            type: string
            enum: [high, medium, low]
          confidence:
            type: number
            minimum: 0
            maximum: 1

- id: pr_010_llm_judge_strategic_reasoning
  description: |
    LLM-as-judge scores reasoning quality on strategic vendor payment.
    Tests correctness, professionalism, and actionability.
  tags: [llm-judge, quality, reasoning]
  input:
    payment_id: PMT-0010
    invoice_id: INV-2010
    vendor: Stark Industries
    amount: 18500.00
    currency: USD
    due_date: "2026-11-15"
    available_cash: 600000.00
    batch_total_committed: 90000.00
    vendor_tier: strategic
  expected:
    decision: pay_now
  pass_threshold: 0.7
  evaluators:
    - type: exact
      field: decision
      weight: 1.0
    - type: llm_judge
      threshold: 0.7
      weight: 1.0
      rubric:
        criteria:
          correctness: >
            Did the agent correctly identify strategic vendor and schedule pay_now?
          professionalism: >
            Is the reason field clear and professional for a treasury team?
          actionability: >
            Does the reason + scheduled_date enable immediate action?
        weights:
          correctness: 0.5
          professionalism: 0.25
          actionability: 0.25

- id: pr_011_zero_cash_defer
  description: When no cash headroom, payment should be deferred.
  tags: [cash, constraints]
  input:
    payment_id: PMT-0011
    invoice_id: INV-2011
    vendor: Initech
    amount: 5000.00
    currency: USD
    due_date: "2026-10-01"
    available_cash: 50000.00
    batch_total_committed: 50000.00
    vendor_tier: standard
  expected:
    decision: defer
  evaluators:
    - type: exact
      field: decision

- id: pr_012_fraud_boundary
  description: Fraud score exactly at threshold (0.7) should still be processed normally.
  tags: [fraud, boundary]
  input:
    payment_id: PMT-0012
    invoice_id: INV-2012
    vendor: Acme Corp
    amount: 1000.00
    currency: USD
    due_date: "2026-10-10"
    available_cash: 100000.00
    batch_total_committed: 20000.00
    vendor_tier: standard
    fraud_score: 0.70
  expected:
    decision: pay_now
  evaluators:
    - type: exact
      field: decision

- id: pr_013_future_early_deadline
  description: Early pay deadline in the future should trigger discount.
  tags: [discount, future-date]
  input:
    payment_id: PMT-0013
    invoice_id: INV-2013
    vendor: Globex Inc
    amount: 5000.00
    currency: USD
    due_date: "2026-12-01"
    available_cash: 200000.00
    batch_total_committed: 50000.00
    vendor_tier: standard
    early_pay_discount_pct: 1.5
    early_pay_deadline: "2026-08-01"
  expected:
    decision: pay_now
  evaluators:
    - type: exact
      field: decision

- id: pr_014_edge_case_zero_amount
  description: Zero amount should be handled gracefully.
  tags: [edge-case, validation]
  input:
    payment_id: PMT-0014
    invoice_id: INV-2014
    vendor: Acme Corp
    amount: 0.00
    currency: USD
    due_date: "2026-10-01"
    available_cash: 100000.00
    batch_total_committed: 20000.00
    vendor_tier: standard
  expected: {}
  evaluators:
    - type: regex
      field: decision
      pattern: "pay_now|defer|hold"

- id: pr_015_precision_currency_conversion
  description: Decimal amounts should maintain precision through split logic.
  tags: [precision, treasury]
  input:
    payment_id: PMT-0015
    invoice_id: INV-2015
    vendor: Stark Industries
    amount: 12345.67
    currency: USD
    due_date: "2026-10-15"
    available_cash: 50000.00
    batch_total_committed: 40000.00
    vendor_tier: standard
  expected:
    decision: split_payment
  evaluators:
    - type: exact
      field: decision

- id: pr_016_confidence_score_always_present
  description: Agent must always return a confidence score [0..1].
  tags: [contract, required-field]
  input:
    payment_id: PMT-0016
    invoice_id: INV-2016
    vendor: Hooli
    amount: 2500.00
    currency: USD
    due_date: "2026-11-01"
    available_cash: 150000.00
    batch_total_committed: 30000.00
    vendor_tier: standard
  expected: {}
  evaluators:
    - type: regex
      field: confidence
      pattern: "^0\\.[0-9]+$|^1\\.0$"

- id: pr_017_watchlist_boundary
  description: Payment at exactly $100 to watchlist should still be held.
  tags: [watchlist, boundary, security]
  input:
    payment_id: PMT-0017
    invoice_id: INV-2017
    vendor: Sketchy Holdings Ltd
    amount: 100.00
    currency: USD
    due_date: "2026-10-01"
    available_cash: 200000.00
    batch_total_committed: 50000.00
    vendor_tier: watchlist
  expected:
    decision: hold
  evaluators:
    - type: exact
      field: decision

- id: pr_018_priority_labeling_consistency
  description: Past-due must have priority=high (regression for labeling bugs).
  tags: [priority, past-due, regression]
  input:
    payment_id: PMT-0018
    invoice_id: INV-2018
    vendor: Initech
    amount: 2000.00
    currency: USD
    due_date: "2025-06-01"
    available_cash: 500000.00
    batch_total_committed: 100000.00
    vendor_tier: standard
  expected:
    decision: pay_now
    priority: high
  evaluators:
    - type: exact
      field: priority
      weight: 1.0

